<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONTROL DE ACCESOS - HOTEL</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #eef2f7; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; }
        #header { background: #2c3e50; color: white; width: 100%; padding: 15px 0; text-align: center; border-bottom: 4px solid #f39c12; }
        .form-container { background: white; width: 90%; max-width: 400px; margin-top: 15px; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin-bottom: 30px; }
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px; }
        .input-group input, .input-group select, .input-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        .input-group textarea { resize: vertical; height: 60px; }
        
        .tab-container { display: flex; width: 90%; max-width: 400px; margin-top: 15px; }
        .tab { flex: 1; padding: 12px; text-align: center; background: #ddd; cursor: pointer; font-weight: bold; border-radius: 10px 10px 0 0; }
        .tab.active { background: white; border-bottom: 3px solid #f39c12; }
        
        #btnGuardar { background: #27ae60; color: white; border: none; width: 100%; padding: 15px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; }
        #btnGuardar:disabled { background: #95a5a6; cursor: not-allowed; }
        
        /* Estilos para Foto */
        .foto-btn-wrapper { position: relative; overflow: hidden; display: inline-block; width: 100%; }
        .btn-camara { border: 2px dashed #f39c12; background: #fdf2e9; color: #d35400; padding: 12px; text-align: center; font-weight: bold; border-radius: 6px; cursor: pointer; display: block; }
        .foto-btn-wrapper input[type=file] { font-size: 100px; position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer; height: 100%; }
        #preview-container { text-align: center; margin-top: 10px; display: none; }
        #preview-foto { max-width: 100%; height: 150px; border-radius: 5px; object-fit: cover; border: 1px solid #ccc; }

        /* Estilos para salida */
        .search-item { background: #f9f9f9; padding: 10px; border: 1px solid #eee; margin-bottom: 8px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; }
        .btn-salida-rapida { background: #e74c3c; color: white; border: none; padding: 8px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        #lista-pendientes { margin-top: 10px; max-height: 300px; overflow-y: auto; }
    </style>
</head>
<body>

    <div id="header">
        <h2 style="margin: 0;">🏨 CONTROL DE ACCESOS</h2>
        <small>Módulo de Seguridad Hotel</small>
    </div>

    <div class="tab-container">
        <div class="tab active" onclick="cambiarTab('entrada')">NUEVA ENTRADA</div>
        <div class="tab" onclick="cambiarTab('salida')">DAR SALIDA</div>
    </div>

    <div id="panel-entrada" class="form-container">
        <div class="input-group">
            <label>📍 Punto de Acceso</label>
            <select id="ubicacion">
                <option value="Principal">Entrada Principal</option>
                <option value="Estacionamiento">Estacionamiento</option>
                <option value="Proveedores">Proveedores / Servicios</option>
            </select>
        </div>
        <div class="input-group"><label>👤 Nombre del Visitante</label><input type="text" id="nombre"></div>
        
        <div style="display: flex; gap: 10px;">
            <div class="input-group" style="flex: 1;">
                <label>🎯 Área a Visitar</label>
                <select id="area_visita">
                    <option value="Recepción">Recepción</option>
                    <option value="Habitación">Habitación</option>
                    <option value="Oficinas RH">Oficinas / RH</option>
                    <option value="Mantenimiento">Mantenimiento</option>
                </select>
            </div>
            <div class="input-group" style="flex: 1;">
                <label>🔢 Detalle (Ej. Hab 302)</label>
                <input type="text" id="detalle_destino" placeholder="Especificar...">
            </div>
        </div>

        <div class="input-group"><label>🔢 Placas</label><input type="text" id="placas"></div>
        <div class="input-group"><label>🚗 Vehículo (Marca/Color)</label><input type="text" id="vehiculo" placeholder="Ej: Nissan Blanco"></div>
        
        <div class="input-group">
            <label>📝 Comentarios (Opcional)</label>
            <textarea id="comentarios" placeholder="Ej. Proveedor de alimentos, candidato a entrevista..."></textarea>
        </div>

        <div class="input-group">
            <label>📸 Evidencia (ID oficial o Vehículo)</label>
            <div class="foto-btn-wrapper">
                <div class="btn-camara">📷 TOMAR FOTO O SUBIR IMAGEN</div>
                <input type="file" id="foto_id" accept="image/*" capture="environment" onchange="mostrarVistaPrevia(event)">
            </div>
            <div id="preview-container">
                <img id="preview-foto" src="">
                <div style="font-size: 11px; color: green; margin-top:5px;">✅ Imagen lista y comprimida</div>
            </div>
        </div>

        <button id="btnGuardar" onclick="registrarEntrada()">REGISTRAR ENTRADA</button>
    </div>

    <div id="panel-salida" class="form-container" style="display:none;">
        <label style="font-weight: bold;">🔍 Buscar persona o placas adentro:</label>
        <input type="text" id="buscarPendiente" oninput="buscarParaSalida()" placeholder="Escribe nombre o placa..." style="width:100%; padding:10px; margin:10px 0; border-radius:5px; border:1px solid #ccc;">
        <div id="lista-pendientes">
            <p style="text-align:center; color:gray;">Cargando personas adentro...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBU3oWLwBkIc_5riruLGc3dFS5wHo2RV0s",
            authDomain: "sistema-vigilancia-6851e.firebaseapp.com",
            projectId: "sistema-vigilancia-6851e",
            storageBucket: "sistema-vigilancia-6851e.firebasestorage.app",
            messagingSenderId: "714792023462",
            appId: "1:714792023462:web:4f560ecf2a16e6a041cb67"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let personasAdentro = [];
        let imagenComprimidaBase64 = null;

        window.mostrarVistaPrevia = function(event) {
            const file = event.target.files;
            if (!file) return;

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const MAX_WIDTH = 600; 
                    let width = img.width;
                    let height = img.height;

                    if (width > MAX_WIDTH) {
                        height = Math.round((height * MAX_WIDTH) / width);
                        width = MAX_WIDTH;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    imagenComprimidaBase64 = canvas.toDataURL('image/jpeg', 0.6); 

                    document.getElementById('preview-foto').src = imagenComprimidaBase64;
                    document.getElementById('preview-container').style.display = 'block';
                }
            }
        };

        window.cambiarTab = function(tipo) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            if(tipo === 'entrada') {
                document.getElementById('panel-entrada').style.display = 'block';
                document.getElementById('panel-salida').style.display = 'none';
                document.querySelectorAll('.tab').classList.add('active');
            } else {
                document.getElementById('panel-entrada').style.display = 'none';
                document.getElementById('panel-salida').style.display = 'block';
                document.querySelectorAll('.tab').classList.add('active');
                cargarPersonasAdentro();
            }
        };

        window.registrarEntrada = async function() {
            const btn = document.getElementById('btnGuardar');
            const area = document.getElementById('area_visita').value;
            const detalle = document.getElementById('detalle_destino').value;
            const destinoFinal = detalle ? `${area} - ${detalle}` : area;

            const data = {
                ubicacion: document.getElementById('ubicacion').value,
                tipo_movimiento: "ENTRADA",
                visitante: document.getElementById('nombre').value || "Desconocido",
                destino: destinoFinal,
                vehiculo_placas: document.getElementById('placas').value || "N/A",
                vehiculo_marca: document.getElementById('vehiculo').value || "N/A",
                comentarios: document.getElementById('comentarios').value || "",
                foto_evidencia: imagenComprimidaBase64 || "NO",
                fecha_hora: new Date().toLocaleString('es-MX'),
                timestamp: new Date().getTime()
            };

            btn.innerText = "Subiendo datos y foto...";
            btn.disabled = true;

            try {
                await addDoc(collection(db, "accesos_hotel"), data);
                alert("✅ Entrada al Hotel registrada correctamente");
                location.reload();
            } catch (error) {
                console.error("Error:", error);
                alert("❌ Error al guardar. Revisa la conexión.");
                btn.innerText = "REGISTRAR ENTRADA";
                btn.disabled = false;
            }
        };

        async function cargarPersonasAdentro() {
            const listado = document.getElementById('lista-pendientes');
            listado.innerHTML = "Buscando...";
            const q = query(collection(db, "accesos_hotel"), orderBy("timestamp", "desc"), limit(60));
            const snap = await getDocs(q);
            personasAdentro = [];
            snap.forEach(doc => {
                const d = doc.data();
                if(d.tipo_movimiento === "ENTRADA") {
                    personasAdentro.push(d);
                }
            });
            renderizarPendientes(personasAdentro);
        }

        function renderizarPendientes(lista) {
            const container = document.getElementById('lista-pendientes');
            container.innerHTML = "";
            if(lista.length === 0) {
                container.innerHTML = "<p style='text-align:center;'>No hay personas adentro.</p>";
                return;
            }
            lista.forEach(p => {
                const div = document.createElement('div');
                div.className = "search-item";
                div.innerHTML = `
                    <div>
                        <strong style="text-transform:uppercase;">${p.vehiculo_placas || 'S/N'}</strong> - ${p.visitante}<br>
                        <small>📍 ${p.destino} (${p.fecha_hora.split(' ')})</small>
                    </div>
                    <button class="btn-salida-rapida" onclick="registrarSalidaDirecta('${p.visitante}','${p.vehiculo_placas}','${p.destino}','${p.vehiculo_marca}')">SALIDA</button>
                `;
                container.appendChild(div);
            });
        }

        window.buscarParaSalida = function() {
            const txt = document.getElementById('buscarPendiente').value.toLowerCase();
            const filtrados = personasAdentro.filter(p => 
                p.visitante.toLowerCase().includes(txt) || 
                p.vehiculo_placas.toLowerCase().includes(txt)
            );
            renderizarPendientes(filtrados);
        };

        window.registrarSalidaDirecta = async function(nombre, placas, dom, veh) {
            if(!confirm(`¿Registrar salida de ${nombre}?`)) return;
            const data = {
                ubicacion: document.getElementById('ubicacion').value || "General",
                tipo_movimiento: "SALIDA",
                visitante: nombre,
                destino: dom,
                vehiculo_placas: placas,
                vehiculo_marca: veh,
                comentarios: "Salida registrada desde sistema",
                foto_evidencia: "NO",
                fecha_hora: new Date().toLocaleString('es-MX'),
                timestamp: new Date().getTime()
            };
            await addDoc(collection(db, "accesos_hotel"), data);
            alert("🔴 Salida Registrada con éxito");
            cambiarTab('entrada');
        };
    </script>
</body>
</html>
